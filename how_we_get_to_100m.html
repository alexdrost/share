<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
  :root{--bg:#001028;--teal:#2890B0;--teal-glow:#5cb6d4;--mint:#58D098;--ink:#eaf0f6;--muted:#8ba3bd}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#001028;color:#eaf0f6;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(60vw 60vw at 12% -8%,rgba(40,144,176,.28),transparent 60%),radial-gradient(60vw 60vw at 90% 110%,rgba(88,208,152,.12),transparent 60%),#001028;z-index:10}
  .box{width:100%;max-width:400px;text-align:center}
  .spin{width:66px;height:66px;margin:0 auto 26px;transform-origin:50% 88%;animation:rk 2.6s ease-in-out infinite}
  @keyframes rk{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
  #gate h1{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:8px;letter-spacing:-.01em;color:#eaf0f6}
  p.sub{color:#8ba3bd;font-size:14px;margin-bottom:26px}
  .row{display:flex;gap:8px;justify-content:center}
  #gate input{flex:1;max-width:230px;background:rgba(140,180,210,.07);border:1px solid rgba(140,180,210,.22);border-radius:10px;
    padding:12px 14px;color:#fff;font-size:15px;font-family:'Inter';outline:none;transition:border-color .2s}
  #gate input:focus{border-color:#5cb6d4}
  #gate button{appearance:none;border:1px solid #2890B0;background:rgba(40,144,176,.28);color:#dcecf4;font-weight:600;
    font-size:15px;padding:12px 20px;border-radius:10px;cursor:pointer;transition:all .2s;font-family:'Inter'}
  #gate button:hover{background:rgba(40,144,176,.5)}
  .err{color:#ff9b8a;font-size:13px;margin-top:14px;min-height:18px;opacity:0;transition:opacity .2s}
  .err.show{opacity:1}
  #content{opacity:0;transition:opacity .6s ease}
  #content.in{opacity:1}
</style>

function b64ToBytes(b){const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function deriveKey(pw,salt,iters){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iters,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function tryUnlock(pw){
  try{
    const salt=b64ToBytes(BLOB.salt), iv=b64ToBytes(BLOB.iv), ct=b64ToBytes(BLOB.ct);
    const key=await deriveKey(pw,salt,BLOB.iters);
    const ptBuf=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    revealContent(new TextDecoder().decode(ptBuf));
    return true;
  }catch(e){return false;}
}
function revealContent(html){
  const c=document.getElementById('content');
  c.innerHTML=html;
  // hoist any <style> from the decrypted payload into <head> so page CSS applies
  c.querySelectorAll('style').forEach(st=>{
    const clone=document.createElement('style');
    clone.textContent=st.textContent;
    document.head.appendChild(clone);
    st.remove();
  });
  document.getElementById('gate').style.display='none';
  c.classList.add('in');
  // re-run scripts (innerHTML scripts don't auto-execute)
  c.querySelectorAll('script').forEach(old=>{
    const s=document.createElement('script');
    if(old.src)s.src=old.src; else s.textContent=old.textContent;
    document.body.appendChild(s); old.remove();
  });
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}
async function attempt(pw,silent){
  const ok=await tryUnlock(pw);
  if(!ok && !silent){document.getElementById('err').classList.add('show');document.getElementById('pw').value='';}
  return ok;
}
(async function(){
  const m=location.hash.match(/key=([^&]+)/);
  if(m){try{let t=m[1].replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';
    if(await attempt(atob(t),true))return;}catch(e){}}
})();
document.getElementById('go').addEventListener('click',()=>attempt(document.getElementById('pw').value,false));
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')attempt(document.getElementById('pw').value,false);});
</script>
